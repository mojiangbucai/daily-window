name: Sync Daily Window editions
on:
  schedule:
    - cron: '17 23 * * *'
    - cron: '17 0,1,2 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-window-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/sync.mjs
      - name: Commit new editions
        run: |
          if ! git diff --quiet -- stories.js; then
            git config user.name 'Daily Window'
            git config user.email 'daily-window@users.noreply.github.com'
            git add stories.js
            git commit -m 'Sync Daily Window editions'
            git push
          fi
